services:
  - type: web
    name: spec-creator-backend
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run prisma:generate --workspace backend && npm run build --workspace backend
    startCommand: npm run start:render --workspace backend
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
